name: Public website

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', 'graphics/**', 'examples/**', 'components/**', 'scripts/**', 'schemas/**', '.claude/**', 'tests/**', 'CLAUDE.md', 'LICENSE', '.gitignore', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'docs/**', 'graphics/**', 'examples/**', 'components/**', 'scripts/**', 'schemas/**', '.claude/**', 'tests/**', 'CLAUDE.md', 'LICENSE', '.gitignore', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install website build dependency
        run: npm ci --prefix site --ignore-scripts
      - name: Read Pages configuration
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build and check the public website
        run: npm run check --prefix site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url || 'https://rkovar.github.io/career-json' }}
      - name: Package only the generated public website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
